# Dependabot configuration (TRUST-004).
#
# Weekly update PRs for npm dependencies (minor and patch releases grouped
# into a single PR to keep noise down; majors get individual PRs) and for
# the GitHub Actions used by the workflows.

version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
