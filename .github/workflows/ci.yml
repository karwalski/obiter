# CI Pipeline for Obiter
#
# Lint, typecheck, test and build only. No secrets are needed: deploys are
# run locally with the npm run deploy:* scripts (see the note at the end).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Supply-chain gates (TRUST-004). Fails on high/critical advisories in
      # production dependencies only; dev-only advisories do not block.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Rejects lockfile entries resolving to non-HTTPS URLs or any host
      # other than the npm registry. Triage/override procedure: docs/ci-cd.md.
      - name: Lint lockfile
        run: >-
          npx --yes lockfile-lint@5.0.0
          --path package-lock.json
          --type npm
          --validate-https
          --allowed-hosts registry.npmjs.org

      - run: npm run lint

      - run: npm run typecheck

      # Fails if APP_VERSION / sw.js CACHE_NAME / manifest <Version> drift from
      # package.json (docs/ci-cd.md deploy checklist). Also runs as `prebuild`.
      - run: npm run check-version

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
        id: tests

      - name: Upload test results
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            junit.xml
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run validate

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # Deploys are not done from CI. The former deploy-website job mirrored
  # website/ into the nginx web root with --delete (which would remove the
  # add-in at /app and /app/beta), pushed every src/ change straight to
  # production without a version bump or beta step, and restarted the API
  # with pkill + screen instead of systemd. Releases go through the
  # reviewed local scripts instead: npm run deploy:app, deploy:beta,
  # deploy:website and deploy:server, then npm run verify-release.
