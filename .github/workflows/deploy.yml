# Manual deployment workflow
#
# Runs the same reviewed scripts as a local release (npm run deploy:beta,
# deploy:app, deploy:website, deploy:server, restart:server), so CI and a
# laptop deploy behave identically. Nothing here mirrors with --delete over
# the web root or restarts the API outside systemd.
#
# Trigger from the Actions tab (Run workflow). Production add-in deploys only
# run from a release tag (vX.Y.Z) that matches package.json, after the full
# gates pass.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   OBITER_SSH_HOST  server IP or hostname
#   OBITER_SSH_KEY   the deploy private key (file contents, not a path)
# Optional:
#   OBITER_SSH_USER  defaults to bitnami
#
# The release itself (version bump, tag, GitHub Release) stays a local step;
# see docs/ci-cd.md and npm run verify-release.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      addin:
        description: "Add-in target: none, beta (/app/beta) or production (/app, release tag only)"
        required: true
        default: none
        type: choice
        options: [none, beta, production]
      website:
        description: "Deploy the website pages (npm run deploy:website)"
        required: true
        default: false
        type: boolean
      server:
        description: "Deploy the API server files (npm run deploy:server)"
        required: true
        default: false
        type: boolean
      restart_server:
        description: "Restart the API through systemd and health-check it (npm run restart:server)"
        required: true
        default: false
        type: boolean

# One deploy at a time; a second run waits rather than racing the first.
concurrency:
  group: obiter-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ inputs.addin != 'none' || inputs.website || inputs.server || inputs.restart_server }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Production deploys only run from the matching release tag
        if: ${{ inputs.addin == 'production' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "Production add-in deploys must run from tag v$VERSION (this run is on $GITHUB_REF)." >&2
            echo "Pick the tag in 'Use workflow from' when starting the run." >&2
            exit 1
          fi

      - name: Gates (version, typecheck, tests)
        if: ${{ inputs.addin != 'none' }}
        run: |
          npm run check-version
          npm run typecheck
          npm test

      - name: Build the add-in
        if: ${{ inputs.addin != 'none' }}
        run: npm run build:prod

      - name: Set up SSH for the deploy scripts
        env:
          OBITER_SSH_HOST: ${{ secrets.OBITER_SSH_HOST }}
          OBITER_SSH_KEY_CONTENT: ${{ secrets.OBITER_SSH_KEY }}
        run: |
          if [ -z "$OBITER_SSH_HOST" ] || [ -z "$OBITER_SSH_KEY_CONTENT" ]; then
            echo "Set the OBITER_SSH_HOST and OBITER_SSH_KEY repository secrets first." >&2
            exit 1
          fi
          KEY="$RUNNER_TEMP/obiter_deploy_key"
          printf '%s\n' "$OBITER_SSH_KEY_CONTENT" > "$KEY"
          chmod 600 "$KEY"
          mkdir -p ~/.ssh
          ssh-keyscan -H "$OBITER_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "OBITER_SSH_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Deploy add-in to beta
        if: ${{ inputs.addin == 'beta' }}
        env:
          OBITER_SSH_HOST: ${{ secrets.OBITER_SSH_HOST }}
          OBITER_SSH_USER: ${{ secrets.OBITER_SSH_USER }}
        run: npm run deploy:beta

      - name: Deploy add-in to production
        if: ${{ inputs.addin == 'production' }}
        env:
          OBITER_SSH_HOST: ${{ secrets.OBITER_SSH_HOST }}
          OBITER_SSH_USER: ${{ secrets.OBITER_SSH_USER }}
        run: npm run deploy:app

      - name: Confirm the server serves this build
        if: ${{ inputs.addin != 'none' }}
        run: |
          SLOT=$([ "${{ inputs.addin }}" = "beta" ] && echo "app/beta" || echo "app")
          BUILT=$(grep -oE 'taskpane\.[a-f0-9]+\.js' dist/taskpane.html | head -1)
          SERVED=$(curl -fsS "https://obiter.com.au/$SLOT/taskpane.html" | grep -oE 'taskpane\.[a-f0-9]+\.js' | head -1)
          echo "built=$BUILT served=$SERVED (/$SLOT)"
          [ "$BUILT" = "$SERVED" ]

      - name: Deploy website pages
        if: ${{ inputs.website }}
        env:
          OBITER_SSH_HOST: ${{ secrets.OBITER_SSH_HOST }}
          OBITER_SSH_USER: ${{ secrets.OBITER_SSH_USER }}
        run: |
          npm run check-seo
          npm run deploy:website

      - name: Deploy API server files
        if: ${{ inputs.server }}
        env:
          OBITER_SSH_HOST: ${{ secrets.OBITER_SSH_HOST }}
          OBITER_SSH_USER: ${{ secrets.OBITER_SSH_USER }}
        run: npm run deploy:server

      - name: Restart the API (systemd) and health-check it
        if: ${{ inputs.restart_server }}
        env:
          OBITER_SSH_HOST: ${{ secrets.OBITER_SSH_HOST }}
          OBITER_SSH_USER: ${{ secrets.OBITER_SSH_USER }}
        run: npm run restart:server

      - name: Remove the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/obiter_deploy_key"
