# Manual Deployment Workflow
#
# Trigger manually from the Actions tab to deploy website and/or
# rebuild the add-in without waiting for a push to main.
#
# Required repository secrets:
#   LIGHTSAIL_SSH_KEY  — SSH private key for the deploy host
#   DEPLOY_KEY         — GitHub deploy key for pushing

name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_website:
        description: 'Deploy website to Lightsail'
        required: true
        default: true
        type: boolean
      deploy_addin:
        description: 'Build and deploy add-in to /app/'
        required: true
        default: true
        type: boolean
      restart_server:
        description: 'Restart the Node.js backend server'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_addin }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run validate

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  deploy-website:
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_website || inputs.restart_server }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$LIGHTSAIL_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy website files
        if: ${{ inputs.deploy_website }}
        run: |
          # Sync website files (excluding server/) to nginx html directory
          rsync -avz --delete --exclude='server/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            website/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/bitnami/nginx/html/

      - name: Deploy server files
        if: ${{ inputs.deploy_website }}
        run: |
          # Sync server files
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            website/server/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/obiter/server/

          # Install dependencies on remote
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cd /var/www/obiter/server && npm ci --production'

      - name: Restart server
        if: ${{ inputs.deploy_website || inputs.restart_server }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'pkill -f "node.*index.js" 2>/dev/null; sleep 1; source /etc/obiter/env.sh && cd /var/www/obiter/server && screen -dmS obiter bash -c "source /etc/obiter/env.sh && node index.js"'

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy-addin:
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_addin }}
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up SSH
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$LIGHTSAIL_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build and deploy add-in
        run: |
          npm ci
          npm run build:prod

          # --exclude 'beta/' — /app/beta/ is the staging slot (see
          # docs/beta-testing.md); promoting production must never wipe it.
          rsync -avz --delete --exclude 'beta/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/bitnami/nginx/html/app/

      - name: Deploy nginx security headers (TRUST-002)
        run: |
          # Regenerate the snippet from config/csp.js (single source of truth)
          # so the deployed headers can never drift from the repo.
          node scripts/generate-nginx-headers.js

          # /opt/bitnami/nginx/conf is root-owned: write via sudo tee. The
          # include line inside the /app/ location block is a one-time manual
          # step (docs/server-setup.md); pushing this file before that exists
          # is harmless.
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'sudo mkdir -p /opt/bitnami/nginx/conf/obiter'
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'sudo tee /opt/bitnami/nginx/conf/obiter/app-security-headers.conf > /dev/null' \
            < scripts/nginx/app-security-headers.conf

          # Reload nginx only if the config test passes; abort the deploy
          # otherwise (nginx keeps serving with the old config).
          if ! ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'sudo /opt/bitnami/nginx/sbin/nginx -t'; then
            echo "ERROR: remote 'nginx -t' failed — nginx was NOT reloaded (old config still active)." >&2
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'sudo /opt/bitnami/nginx/sbin/nginx -s reload'

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
