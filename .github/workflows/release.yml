name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type check
        run: npm run typecheck

      - name: Package add-in
        run: bash scripts/package.sh

      - name: Determine zip filename
        id: zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "filename=obiter-v${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # TRUST-005: checksum every zip attached to the release so sideload
      # users can verify downloads (see INSTALL.md "Verifying downloads").
      - name: Generate checksums
        run: sha256sum "${{ steps.zip.outputs.filename }}" > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.zip.outputs.filename }}
            SHA256SUMS.txt
          generate_release_notes: true
          name: Obiter v${{ steps.zip.outputs.version }}
          body: |
            Built by workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Verify downloaded zips against `SHA256SUMS.txt` — see the "Verifying downloads" section of INSTALL.md.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
