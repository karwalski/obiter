name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # OPS-RELEASES-01: package.json is the single source of truth for the
      # version (scripts/package.sh reads it). A tag that doesn't match it
      # would publish a mislabelled release, so fail loudly before building.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version v${VERSION}."
            echo "::error::Bump package.json (and manifests) before tagging, or re-tag the correct commit."
            exit 1
          fi
          echo "Tag ${TAG} matches package.json version ${VERSION}."

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type check
        run: npm run typecheck

      # Guard against a release that displays a stale version or ships a stale
      # service-worker cache key (docs/ci-cd.md deploy checklist).
      - name: Check version sync
        run: npm run check-version

      - name: Package add-in
        run: bash scripts/package.sh

      - name: Determine zip filename
        id: zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "filename=obiter-v${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # TRUST-005: checksum every zip attached to the release so sideload
      # users can verify downloads (see INSTALL.md "Verifying downloads").
      - name: Generate checksums
        run: sha256sum "${{ steps.zip.outputs.filename }}" > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.zip.outputs.filename }}
            SHA256SUMS.txt
          generate_release_notes: true
          name: Obiter v${{ steps.zip.outputs.version }}
          body: |
            Built by workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Verify downloaded zips against `SHA256SUMS.txt` — see the "Verifying downloads" section of INSTALL.md.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # OPS-RELEASES-01: keep only the last two classic releases published
      # (2026-07-08 decision) so releases can't drift or pile up. Deletes
      # release entries only — git tags are kept. Copilot releases/tags
      # (anything matching "copilot" or v1.15.1) are never touched.
      - name: Prune old classic releases
        run: bash scripts/prune-releases.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
